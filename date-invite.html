<!doctype html>
<html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A little question for baby</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(125deg,#e5f3fc,#f3fbff 48%,#d4eaf8);color:#35576e;font-family:Georgia,serif;overflow-x:hidden}.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}.petal{position:absolute;color:#88bad8;opacity:.28;animation:float 11s infinite linear;font-size:13px}.card{position:relative;z-index:1;width:min(440px,calc(100% - 40px));min-height:310px;background:#f8fcffed;border:1px solid #ffffffa6;border-radius:22px;padding:45px 25px 30px;text-align:center;box-shadow:0 22px 40px #50769020}.eyebrow,.hint,.signature{color:#729bb6;font-size:13px;font-style:italic}.eyebrow{margin:0 0 12px}h1{font-size:clamp(28px,7vw,38px);font-weight:bold;font-style:italic;line-height:1.2;margin:0 auto 24px;max-width:350px}.buttons{position:relative;height:94px;max-width:300px;margin:0 auto}button{font-family:Georgia,serif;border-radius:30px;padding:12px 25px;font-size:14px;cursor:pointer;transition:background .2s,transform .2s}button:focus-visible{outline:3px solid #35576e;outline-offset:4px}#yes{background:#6bafd4;color:white;border:1px solid #6bafd4;box-shadow:0 5px 12px #579ac42b}#yes:hover{background:#5597be;transform:translateY(-2px)}#no{position:absolute;left:15px;top:53px;border:1px solid #d1e4f0;background:#fbfdff;color:#638094;padding:9px 22px}.hint{margin:3px 0 20px;min-height:17px;font-size:12px}.signature{font-size:12px;margin:0}.success p{line-height:1.8;font-size:17px}.bigheart{font-size:52px;color:#6bafd4;margin:0 0 18px}.success h1{font-size:34px;margin-bottom:15px}#again{background:transparent;border:1px solid #d1e4f0;color:#63859e;margin:15px 0}[hidden]{display:none!important}@keyframes float{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(160deg)}}@media(prefers-reduced-motion:reduce){.petal{animation:none}button{transition:none}}
</style></head><body><div class="petals" id="petals" aria-hidden="true"></div><main class="card"><section id="question"><p class="eyebrow">just a small question, baby</p><h1>Pwede ba kita<br>ayain lumabas?</h1><div class="buttons"><button id="yes">Yes</button><button id="no">No</button></div><p class="hint" id="hint" aria-live="polite">what do you say? ♡</p><p class="signature">— Yciane ♥</p></section><section class="success" id="success" hidden tabindex="-1"><div class="bigheart" aria-hidden="true">♥</div><h1>Yay! It's a date, baby.</h1><p>Kahit simpleng lakad lang,<br>basta kasama kita, masaya na ako.</p><p>Message mo ako kung kailan ka free.<br>Ikaw ang pipili ng araw. ♡</p><p class="signature">Excited na akong makita ka.<br>— Yciane ♥</p><button id="again">Read the question again</button></section></main><script>
const question=document.getElementById('question'),success=document.getElementById('success'),no=document.getElementById('no'),hint=document.getElementById('hint');
document.getElementById('yes').addEventListener('click',()=>{question.hidden=true;success.hidden=false;success.focus();});
let noClicks=0; const noSpots=[[180,52],[8,5],[165,5],[70,53]]; no.addEventListener('click',()=>{const spot=noSpots[noClicks%noSpots.length]; const bounds=no.parentElement; no.style.left=Math.min(spot[0],Math.max(0,bounds.clientWidth-no.offsetWidth))+'px'; no.style.top=spot[1]+'px'; noClicks++; document.getElementById('yes').style.transform='scale('+Math.min(1+noClicks*.18,1.9)+')'; const sadNotes=['Are you sure, baby? 🥺','Aww, kahit saglit lang? 😢','Gusto lang naman kitang makasama… 🥺','Kahit simpleng lakad lang? 💙','Sayang naman, excited pa naman ako… 😔','Okay lang, baby. Baka next time? 🩵']; hint.textContent=sadNotes[Math.min(noClicks-1,sadNotes.length-1)];});
document.getElementById('again').addEventListener('click',()=>{success.hidden=true;question.hidden=false;hint.textContent='what do you say? ♡';noClicks=0;no.style.left='15px';no.style.top='53px';document.getElementById('yes').style.transform='';document.getElementById('yes').focus();});
for(let i=0;i<16;i++){const p=document.createElement('span');p.className='petal';p.textContent=i%3===0?'♥':'✦';p.style.left=(i*6.4)+'%';p.style.top='-15px';p.style.animationDelay=-(i*.73)+'s';p.style.animationDuration=(10+i%5)+'s';document.getElementById('petals').appendChild(p);}
</script></body></html>
